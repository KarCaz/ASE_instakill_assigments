spring:
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    url: jdbc:sqlite:./instakill.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  servlet:
    context-path: /
springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger
management:
  endpoints:
    web:
      exposure:
        include: health,info
media:
  base-path: media
  processing:
    max-width: 300
    watermark-text: Instakill Demo
notification:
  ntfy:
    enabled: true
    base-url: https://ntfy.sh
    # Public topic: anyone who knows the name can read it. Set NTFY_TOPIC to something unique.
    topic: ${NTFY_TOPIC:instakill-demo-change-me}
instakill:
  jwt:
    secret: change-me-change-me-change-me-change-me-change-me-secret-key-1234
    issuer: instakill
    ttl-minutes: 120
logging:
  level:
    org.hibernate.SQL: warn
